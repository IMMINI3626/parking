<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주차 안내 시스템 - 관리자</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><div class="frame fit"><section class="pane admin"><nav class="topnav"><a href="{{ url_for('home') }}">처음 화면</a><a href="{{ url_for('guide') }}" target="_blank">내비게이션 대시보드 열기 ↗</a></nav><h1>관리자 화면</h1><div class="layout"><section class="box map"><h2>1. 주차도면</h2><svg class="lot" id="adm" viewBox="0 0 526 450"></svg><div class="legend"><span>빈자리 <b id="free">-</b></span><span><i class="dot g"></i>배정됨</span><span><i class="dot r"></i>주차 완료</span><span>경 / S / B = 경차 / 소형 / 대형</span></div></section><div class="box panel"><div class="col"><section class="sec"><h2>수위 센서 / 침수 알림</h2><div class="water off" id="water"><div class="row"><span>수위 센서</span><b id="waterValue">-</b></div><div class="bar"><i id="waterBar"></i><em id="waterLimit"></em></div><div class="row"><span id="waterPredictLabel">15분 뒤 예측</span><b id="waterPredict">-</b></div><div class="alert" id="waterAlert">센서 꺼짐</div><div class="row esp"><span>ESP32 알림</span><b id="waterEsp">-</b></div></div></section><section class="sec grow camsec"><h2>입구 카메라</h2><div class="cam"><img id="camImg" alt="입구 카메라 영상" hidden><div><div class="row"><span>상태</span><b id="camStatus">-</b></div><div class="row"><span>읽은 글자</span><b id="camText">-</b></div></div></div></section><section class="sec"><h2>2. 차량 배정</h2><div id="detected"></div><form id="assignForm" class="row"><input id="plate" placeholder="차량번호" required><button class="sim">배정</button></form><div id="msg" class="message"></div></section></div><div class="col"><section class="sec"><h2>현재 안내 차량 <small class="message">(내비 화면과 같은 차량)</small></h2><div id="current" class="table"></div></section><section class="sec grow"><h2>3. 주차 현황</h2><div id="summary" class="summary"></div><div id="assignments" class="table"></div></section><sec
