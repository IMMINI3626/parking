<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주차장 도면도</title>
<style>
    :root{
        box-sizing:border-box;
        padding-top:env(safe-area-inset-top,0px);
        padding-bottom:env(safe-area-inset-bottom,0px);
        --bg:#eceff1;--road:#4a4f55;
        --zone:#5b6168;
        --line:#f5f5f5;
        --bld:#f3efe6;
        --bldline:#2b2f33;
        --ink:#222;
        --pole:#ffd54a
    }

    html{
        scroll-padding-top:env(safe-area-inset-top,0px);
        height:100%
    }
    
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--ink:#e8e8e8}}
    
    :root[data-theme="dark"]{--bg:#15181b;--ink:#e8e8e8}
    body{
        margin:0;
        height:100%;
        overflow:hidden;
        background:var(--bg);
        color:var(--ink);
        font-family:"Noto Sans KR","Malgun Gothic",sans-serif
    }

    main{
        height:100%;
        box-sizing:border-box;
        padding:8px 12px;
        display:flex;
        flex-direction:column;
        gap:6px
    }

    h1{
        font-size:16px;margin:0;
        flex:none
    }

    .wrap{
        flex:1;
        min-height:0
    }

    svg{
        width:100%;
        height:100%;
        display:block;
        border-radius:6px;
        overflow:hidden
    }

    .bay{
        fill:none;
        stroke:var(--line);
        stroke-width:2
    }
    
    .zone{fill:var(--zone)}

    .pole{
        fill:var(--pole);
        stroke:#7a5c00;
        stroke-width:2
    }

    .bld{
        fill:var(--bld);
        stroke:var(--bldline);
        stroke-width:3
    }

    .bt{
        font-size:30px;
        font-weight:700;
        fill:var(--bldline);
        text-anchor:middle;
        dominant-baseline:central
    }

    .hl{
        fill:rgba(30,80,255,.12);
        stroke:#1e50ff;
        stroke-width:5
    }

    .arrow{
        fill:#fff;
        stroke:#333;
        stroke-width:3
    }

    .legend{
        flex:none;
        display:flex;
        gap:16px;
        font-size:12px;
        flex-wrap:wrap
    }

    .legend i{
        display:inline-block;
        width:14px;
        height:14px;
        vertical-align:-2px;
        margin-right:6px
    }
</style>
</head>

<body>
    <main>
        <h1>주차장 도면도</h1>
        <div class="wrap">
            <svg id="s" viewBox="0 0 1650 1105" preserveAspectRatio="xMidYMid meet" role="img" aria-label="110동~115동 주차장 도면도">
                <rect width="1650" height="1105" fill="var(--road)"/>
                <g id="zones"></g><g id="bays"></g><g id="poles"></g><g id="blds"></g>
                <rect class="hl" x="1262" y="632" width="376" height="440" rx="36"/>
                <path class="arrow" d="M1581 961 L1618 1000 L1599 1000 L1599 1100 L1563 1100 L1563 1000 L1544 1000 Z"/>
            </svg>
        </div>

        <div class="legend">
            <span><i style="background:#ffd54a;border:2px solid #7a5c00"></i>기둥/가로등</span>
            <span><i style="border:2px solid #1e50ff;background:rgba(30,80,255,.15)"></i>출입구 구역</span>
            <span>↑ 차량 진입 방향</span>
        </div>
    </main>

    <script>
        // 구역: [x1,y1,x2,y2], 주차칸 시작: [x, 칸수], 기둥: [x,y]
        // 오른쪽 구역 x2는 viewBox 너비(1650)를 넘지 않게 1650으로 통일
        const R=[
            {z:[1,1,762,157],y:31,b:[[42,2],[192,3],[381,3],[581,3]],p:[[163,101],[352,101],[552,101]]},                
            {z:[882,1,1650,160],y:31,b:[[932,3],[1143,3],[1342,3],[1532,2]],p:[[1113,101],[1312,101],[1502,101]]},
            {z:[1,321,762,461],y:341,b:[[7,3],[197,3],[386,3],[587,3]],p:[[167,351],[357,351],[546,351]]},
            {z:[882,321,1650,461],y:341,b:[[938,2],[1079,3],[1268,3],[1457,3]],p:[[1048,351],[1238,351],[1428,351],[1618,351]]},
            {z:[1,638,762,778],y:658,b:[[1,3],[190,3],[380,3],[581,3]],p:[[161,720],[351,720],[542,720]]},
            {z:[882,638,1650,778],y:658,b:[[901,1],[984,3],[1169,3],[1358,4]],p:[[957,720],[1140,720],[1328,720]]},
            {z:[1,941,762,1081],y:961,b:[[71,2],[211,3],[400,3],[601,3]],p:[[181,971],[371,971],[560,971]]},
            {z:[882,941,1650,1081],y:961,b:[[938,2],[1082,3],[1271,3],[1461,1]],p:[[1048,971],[1241,971],[1431,971]]}
        ];

        const B=[["115동",8,176],["114동",1427,176],["112동",8,481],["113동",1431,485],["111동",8,801],["110동",1436,791]];
        let z="",b="",p="",d="";

        R.forEach(r=>{
            z+=`<rect class="zone" x="${r.z[0]}" y="${r.z[1]}" width="${r.z[2]-r.z[0]}" height="${r.z[3]-r.z[1]}"/>`;
            r.b.forEach(([x,n])=>{for(let i=0;i<n;i++)b+=`<rect class="bay" x="${x+i*50}" y="${r.y}" width="50" height="100"/>`});
            r.p.forEach(([x,y])=>p+=`<rect class="pole" x="${x}" y="${y}" width="20" height="20"/>`);
        });

        B.forEach(([t,x,y])=>d+=`<rect class="bld" x="${x}" y="${y}" width="181" height="130"/><text class="bt" x="${x+90}" y="${y+65}">${t}</text>`);
        zones.innerHTML=z;bays.innerHTML=b;poles.innerHTML=p;blds.innerHTML=d;
    </script>
    </body>
</html>
